<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #ffffff;
  --page: #f4f6f9;
  --ink: #1d2733;
  --ink-2: #4a5768;
  --ink-3: #7a8696;
  --line: #c9d2dd;
  --line-2: #e3e8ee;
  --head: #e8eef6;
  --head-ink: #1f3a5f;
  --brand: #1f4e8c;
  --brand-2: #163b6b;
  --brand-soft: #e7eef8;
  --pass: #1d7a46;
  --pass-bg: #e3f4ea;
  --fail: #b42318;
  --fail-bg: #fde8e6;
  --na: #5b6573;
  --na-bg: #eceff3;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --major: #b42318;
  --minor: #9a6400;
  --radius: 8px;
  --tap: 44px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --font: "Sarabun", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 16px; line-height: 1.55; color: var(--ink); background: var(--page); -webkit-text-size-adjust: 100%; }
a { color: var(--brand); }
h1 { font-size: 1.45rem; margin: 0 0 .25rem; font-weight: 700; }
h2 { font-size: 1.15rem; margin: 1.25rem 0 .5rem; font-weight: 600; color: var(--head-ink); }
h3 { font-size: 1rem; margin: 1rem 0 .4rem; font-weight: 600; }
small, .muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- layout */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: #12253f; color: #dbe5f3; padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brandmark { font-weight: 700; font-size: 1.05rem; color: #fff; padding: 4px 10px 14px; letter-spacing: .2px; }
.brandmark small { display: block; color: #9fb3cf; font-weight: 400; font-size: .78rem; }
.side nav a { display: flex; align-items: center; gap: 10px; color: #dbe5f3; text-decoration: none; padding: 10px; border-radius: 6px; min-height: var(--tap); }
.side nav a:hover { background: rgba(255,255,255,.07); }
.side nav a.on { background: #24477a; color: #fff; font-weight: 600; }
.side .who { border-top: 1px solid rgba(255,255,255,.12); margin-top: 16px; padding: 12px 10px; font-size: .85rem; color: #9fb3cf; }
.side .who b { color: #fff; font-weight: 600; display: block; }
.main { min-width: 0; padding: 20px 24px 80px; }
.topbar { display: none; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 60; }
  .side.open { display: block; }
  .topbar { display: flex; align-items: center; gap: 10px; background: #12253f; color: #fff; padding: 8px 12px; position: sticky; top: 0; z-index: 50; }
  .topbar button { background: none; border: 0; color: #fff; font-size: 1.4rem; min-width: var(--tap); min-height: var(--tap); }
  .main { padding: 14px 12px 90px; }
}

/* ---------- cards & tiles */
.card { background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; }
.tile .n { font-size: 1.7rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-2); font-size: .9rem; }
.tile.alert .n { color: var(--fail); }
.tile.warn .n { color: var(--warn); }

/* ---------- buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #f3f6fa; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.danger { color: var(--fail); border-color: #e5b4ae; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
label { font-weight: 500; font-size: .92rem; color: var(--ink-2); display: block; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=url], input[type=search], input[type=password], select, textarea {
  font: inherit; width: 100%; min-height: var(--tap); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
}
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus, .btn:focus-visible, button:focus-visible { outline: 3px solid #8fb2e3; outline-offset: 1px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid .wide { grid-column: span 2; }
@media (max-width: 520px) { .grid .wide { grid-column: auto; } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
.filters > div { min-width: 150px; }

/* ---------- tables */
.tbl { width: 100%; border-collapse: collapse; background: #fff; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; }
.tbl th { background: var(--head); color: var(--head-ink); font-weight: 600; }
.tbl tr.sec td { background: #f1f4f8; font-weight: 600; color: var(--head-ink); }
.tablewrap { overflow: auto; border: 1px solid var(--line-2); border-radius: var(--radius); background: #fff; max-width: 100%; }
.tablewrap .tbl { border: 0; }
.list .tbl td { vertical-align: middle; }

/* ---------- badges & status */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.b-open, .b-reopened { background: #fdecea; color: #a12a1e; border-color: #f3c3bd; }
.b-assigned, .b-in_progress { background: #fff4d6; color: #7a5200; border-color: #f0d79a; }
.b-pending_verification { background: #e7eef8; color: #1f4e8c; border-color: #c2d3ea; }
.b-closed, .b-completed { background: #e3f4ea; color: #1d6b3f; border-color: #b9e0c8; }
.b-draft, .b-in_progress_a { background: #eceff3; color: #3c4655; }
.b-pending_signatures, .b-amended { background: #e7eef8; color: #1f4e8c; border-color: #c2d3ea; }
.b-cancelled, .b-retired { background: #eceff3; color: #6b7480; text-decoration: line-through; }
.b-published { background: #e3f4ea; color: #1d6b3f; }
.b-major { background: #fde8e6; color: var(--major); border-color: #f3c3bd; }
.b-minor { background: #fff4d6; color: var(--minor); border-color: #f0d79a; }
.b-pending { background: var(--warn-bg); color: var(--warn); border-color: #f0d79a; }
.b-overdue { background: var(--fail); color: #fff; }
.notice { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; border-radius: 6px; margin: 8px 0; color: #5b3d00; }
.notice.info { border-color: var(--brand); background: var(--brand-soft); color: #1b365d; }
.notice.err { border-color: var(--fail); background: var(--fail-bg); color: #7a1a12; }
.messages { list-style: none; padding: 0; margin: 0 0 12px; }
.messages li { padding: 10px 12px; border-radius: 6px; margin-bottom: 6px; background: var(--brand-soft); }
.messages li.error { background: var(--fail-bg); color: #7a1a12; }
.messages li.success { background: var(--pass-bg); color: #145232; }

/* ---------- PJO form */
.formhead { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
.formhead .title { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.formhead .title h1 { font-size: 1.15rem; }
.formhead .fields { padding: 12px 14px; display: grid; gap: 10px 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.formhead .fields input, .formhead .fields select { min-height: 40px; }
.savebar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
@media (max-width: 900px) { .savebar { top: 60px; } }
.savestate { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; font-weight: 500; }
.savestate .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pass); }
.savestate.pending .dot { background: #d29a00; }
.savestate.offline .dot, .savestate.error .dot { background: var(--fail); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--line); margin-bottom: 12px; scrollbar-width: thin; }
.tabs button { border: 1px solid var(--line); border-bottom: 0; background: #eef2f7; padding: 8px 14px; min-height: var(--tap); border-radius: 6px 6px 0 0; font: inherit; font-weight: 500; color: var(--ink-2); cursor: pointer; text-align: left; line-height: 1.25; }
.tabs button small { display: block; font-size: .78rem; color: var(--ink-3); font-weight: 400; }
.tabs button.on { background: #fff; color: var(--head-ink); font-weight: 700; position: relative; top: 2px; border-color: var(--line); border-bottom: 2px solid #fff; }
.sheet { background: #fff; border: 1px solid var(--line); border-radius: 0 var(--radius) var(--radius) var(--radius); padding: 12px; }
.sheettitle { text-align: center; font-weight: 700; color: var(--head-ink); white-space: pre-line; padding: 6px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; margin-bottom: 8px; color: var(--ink-2); }
.resp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 10px; }
.resp > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: .92rem; }
.resp .maj { border-left: 5px solid var(--major); background: #fff7f6; }
.resp .min { border-left: 5px solid var(--minor); background: #fffbf0; }
@media (max-width: 700px) { .resp { grid-template-columns: 1fr; } }

/* mark symbols: text + colour */
.mk { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; border-radius: 4px; font-weight: 700; font-size: 1rem; }
.mk.pass { color: var(--pass); background: var(--pass-bg); }
.mk.fail { color: var(--fail); background: var(--fail-bg); }
.mk.na { color: var(--na); background: var(--na-bg); font-size: .78rem; }
.mk.empty { color: #b2bac5; }

/* sheet 1 full grid */
.s1grid { border-collapse: separate; border-spacing: 0; min-width: 980px; width: 100%; }
.s1grid th, .s1grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; background: #fff; }
.s1grid thead th { position: sticky; top: 0; z-index: 3; background: var(--head); color: var(--head-ink); font-weight: 600; padding: 6px 4px; text-align: center; font-size: .9rem; }
.s1grid .q { position: sticky; left: 0; z-index: 2; min-width: 300px; max-width: 420px; padding: 8px 10px; font-size: .93rem; border-left: 1px solid var(--line); background: #fff; }
.s1grid thead .q { z-index: 4; text-align: left; background: var(--head); }
.s1grid tr.grp td { background: #f1f4f8; font-weight: 600; color: var(--head-ink); padding: 6px 10px; position: sticky; left: 0; }
.s1grid .q .sev { margin-right: 4px; }
.s1grid td.cell { width: 52px; text-align: center; }
.cellbtn { width: 100%; height: 100%; min-height: 50px; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: inherit; }
.cellbtn:hover { background: #f2f6fb; }
.cellbtn.cur { box-shadow: inset 0 0 0 2px var(--brand); }
.cellbtn .t { font-size: .7rem; color: var(--ink-2); line-height: 1; }
.cellbtn .warn { font-size: .68rem; color: var(--fail); font-weight: 700; line-height: 1; }
.cellbtn.locked { cursor: default; }
.toolbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 10px; }
.tool { min-height: var(--tap); min-width: 64px; border: 2px solid var(--line); background: #fff; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; padding: 0 10px; }
.tool.on { border-color: var(--brand); background: var(--brand-soft); }
.tool.t-pass { color: var(--pass); } .tool.t-fail { color: var(--fail); } .tool.t-na { color: var(--na); }

/* sheet 1 per-occurrence (mobile) */
.occbar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; position: sticky; top: 56px; background: #fff; z-index: 5; }
.occbar button { min-width: var(--tap); min-height: var(--tap); border: 1px solid var(--line); background: #fff; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; position: relative; }
.occbar button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.occbar button .pip { position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--fail); }
.itemcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: #fff; }
.itemcard .txt { font-size: 1rem; margin-bottom: 8px; }
.choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice button { min-height: 52px; border-radius: 8px; border: 2px solid var(--line); background: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.choice button.c-pass.on { background: var(--pass); border-color: var(--pass); color: #fff; }
.choice button.c-fail.on { background: var(--fail); border-color: var(--fail); color: #fff; }
.choice button.c-na.on { background: var(--na); border-color: var(--na); color: #fff; }
.choice button:disabled { opacity: .45; }
.choice.two { grid-template-columns: repeat(2, 1fr); }
.meta { font-size: .8rem; color: var(--ink-3); margin-top: 4px; }

/* sheet 2 */
.s2tbl td.m { width: 132px; text-align: center; vertical-align: middle; }
.s2tbl .choice { grid-template-columns: 1fr 1fr; gap: 4px; }
.s2tbl .choice button { min-height: 44px; font-size: 1rem; }

/* sheet 3/4 */
.qa td { font-size: .93rem; }
.qa textarea { min-height: 60px; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fafbfd; font-size: .92rem; white-space: pre-line; }
.steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.steps4 > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: .9rem; background: #fff; }
.steps4 b { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; align-items: center; justify-content: center; margin-right: 6px; font-size: .85rem; }
@media (max-width: 800px) { .steps4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .steps4 { grid-template-columns: 1fr; } }

/* signature blocks */
.sigs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
.sig { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fff; }
.sig .who { font-weight: 600; }
.sig img { max-width: 100%; height: 60px; object-fit: contain; display: block; border-bottom: 1px solid var(--line-2); margin: 6px 0; }
.sig.req { border-left: 4px solid var(--brand); }

/* modal / bottom sheet */
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 35, .45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; border-radius: 10px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
.modal header h2 { margin: 0; font-size: 1.1rem; }
.modal .body { padding: 14px 16px; }
.modal footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: #fff; }
.xbtn { border: 0; background: none; font-size: 1.6rem; min-width: var(--tap); min-height: var(--tap); cursor: pointer; color: var(--ink-2); }
@media (max-width: 640px) {
  .overlay.sheetmode { align-items: flex-end; padding: 0; }
  .overlay.sheetmode .modal { border-radius: 14px 14px 0 0; max-height: 94vh; width: 100%; }
}
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: #fff; z-index: 90; box-shadow: -10px 0 30px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.drawer iframe { flex: 1; border: 0; width: 100%; }

/* stopwatch */
.sw-display { font-variant-numeric: tabular-nums; font-size: 3rem; font-weight: 700; text-align: center; letter-spacing: 1px; line-height: 1.1; }
.sw-sub { text-align: center; color: var(--ink-2); margin-bottom: 10px; }
.sw-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.sw-btns .btn { min-height: 56px; font-size: 1.05rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; font-size: .92rem; }
.kv div b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }

/* signature pad */
.padwrap { border: 2px dashed var(--line); border-radius: 8px; background: #fbfcfe; touch-action: none; position: relative; }
.padwrap canvas { width: 100%; height: 220px; display: block; touch-action: none; }
.padwrap .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #b2bac5; pointer-events: none; }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 200; max-width: 92vw; box-shadow: var(--shadow); }
.toast.err { background: var(--fail); }
.hidden { display: none !important; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.src { font-size: .75rem; color: var(--ink-3); }
.pre { white-space: pre-line; }

/* ---------- phone refinements */
.tabs .short { display: none; }
.headtoggle summary { list-style: none; cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--head-ink); min-height: var(--tap); }
.headtoggle summary::-webkit-details-marker { display: none; }
.headtoggle summary::after { content: " ▾"; color: var(--ink-3); }
.headtoggle[open] summary::after { content: " ▴"; }
@media (max-width: 900px) {
  .savebar { position: static; }
  #saveState { position: fixed; right: 10px; bottom: 10px; z-index: 45; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: calc(100vw - 20px); }
  .tabs button { padding: 6px 10px; }
  .tabs .long, .tabs button small { display: none; }
  .tabs .short { display: inline; }
  .occbar { top: 52px; }
  .formhead .title h1 { font-size: 1.05rem; }
}
body { overflow-wrap: break-word; }
.src, .notice, .box, .kv b, .tbl td { overflow-wrap: anywhere; }

/* G/B/R as confirmed: G Complete, B On progress, R Overdue (letter always shown with colour) */
.gbr-G { background: #1d7a46; color: #fff; }
.gbr-B { background: #1f4e8c; color: #fff; }
.gbr-R { background: #b42318; color: #fff; }

/* ---- Apps Script single-page additions */
.login { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
.loading { padding:40px; text-align:center; color: var(--ink-3); }
.spinner { width:28px; height:28px; border:3px solid var(--line); border-top-color: var(--brand); border-radius:50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
a.btn { color: var(--ink); } a.btn.primary { color:#fff; }
.side .who button { margin-top:8px; }
.kv2 { display:grid; grid-template-columns: 160px 1fr; gap:6px 12px; }
@media (max-width:640px) { .kv2 { grid-template-columns: 1fr; } }
@media print {
  .side, .topbar, .noprint, .toast { display:none !important; }
  .shell { display:block; } .main { padding:0; } body { background:#fff; }
}
</style>

</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div>กำลังโหลด CPS PJO Audit…</div></div>
<script>
/* Shared client library: server calls, small DOM helpers, modal/toast, Excel writer. */
var PJO = window.PJO || {};
(function () {
  'use strict';
  var mem = {};
  PJO.store = {
    get: function (k) { try { var v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : null) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : null; } },

  // ------------------------------------------------------------------ minimal XLSX writer
  // Builds a real .xlsx (Office Open XML) with inline strings — no external library needed.
  var CRC = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ''); }
  function colName(i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  /** sheets: [{name, header:[...], rows:[[...]], widths:[...]}] */
  PJO.xlsx = function (sheets) {
    var files = [];

    files.push({ name: '[Content_Types].xml', text: XMLH + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map(function (s, i) { return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('') + '</Types>' });

      sheets.map(function (s, i) { return '<sheet name="' + esc(s.name.slice(0, 31)) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('') + '</sheets></workbook>' });

      sheets.map(function (s, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' });
    files.push({ name: 'xl/styles.xml', text: XMLH + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE6F1"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FF999999"/></left><right style="thin"><color rgb="FF999999"/></right><top style="thin"><color rgb="FF999999"/></top><bottom style="thin"><color rgb="FF999999"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf><xf borderId="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' });
    sheets.forEach(function (s, i) {
      var rows = [s.header].concat(s.rows);
      var xml = XMLH + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';

  };

    var a = PJO.h('a', { href: url, download: filename });

    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000);
  };

<script>
/* CPS PJO Audit – audit form
 * Renders the 4 sheets from the template snapshot, autosaves every change as an
 * idempotent op (queued in localStorage when offline), opens the issue window on ×,
 * runs the timestamp-based stopwatch and captures signatures.
 */
PJO.mountAudit = function (B) {
  'use strict';

  // ------------------------------------------------------------ boot (B comes from the audit_open API)
  const SNAP = B.snapshot;
  let ST = B.state;
  const AID = ST.id;
  const SYM = { pass: '√', fail: '×', na: 'N/A' };
  const SYM_TH = { pass: 'ปฏิบัติตามมาตรฐาน', fail: 'ไม่ปฏิบัติตามมาตรฐาน', na: 'ไม่เกี่ยวข้อง' };
  const PAGE_LOADED_AT = Date.now();
  const SERVER_OFFSET = ST.server_now - PAGE_LOADED_AT; // server clock minus device clock
  const $ = (s, r) => (r || document).querySelector(s);

  // ------------------------------------------------------------ small utils
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function cookie(name) {
    const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? decodeURIComponent(m.pop()) : '';
  }
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function toast(msg, err) {
    const t = h('div', { class: 'toast' + (err ? ' err' : ''), role: 'alert', text: msg });
    document.body.append(t);
    setTimeout(() => t.remove(), err ? 6000 : 3000);
  }
  async function req(key, body) {
    // google.script.run; rejects only when the network is down
    return PJO.call(key, Object.assign({ audit_id: AID }, body || {}));
  }
  function fmtSec(s) { return s === null || s === undefined ? '–' : Number(s).toFixed(2); }
  function clock(ms) {
    ms = Math.max(0, ms);
    const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
    return (m ? m + ':' + (s < 10 ? '0' : '') : '') + s.toFixed(2);
  }

  // ------------------------------------------------------------ template index
  const ITEMS = {};
  SNAP.s1.items.forEach(i => { ITEMS[i.key] = Object.assign({ sheet: 's1' }, i); });
  SNAP.s2.sections.forEach(s => s.items.forEach(i => { ITEMS[i.key] = Object.assign({ sheet: 's2', section: s.code }, i); }));
  SNAP.s3.questions.forEach(q => { ITEMS[q.key] = Object.assign({ sheet: 's3' }, q); });
  SNAP.s4.cases.forEach(c => { ITEMS[c.key] = Object.assign({ sheet: 's4' }, c); });
  const NOCC = SNAP.s1.frequency_count || 12;
  const itemLabel = (it) => it.sheet === 's2' ? it.code : (it.sheet === 's4' ? 'กรณี ' + it.no : 'ข้อ ' + it.no);

  // ------------------------------------------------------------ ui state
  const ui = {
    tab: lsGet('pjo-tab-' + AID) || 's1',
    view: lsGet('pjo-view') || (window.innerWidth < 900 ? 'occ' : 'grid'),
    occ: 1,
    tool: 'pass',
  };
  const canEdit = () => ST.can_edit && ST.status !== 'cancelled';
  const isLocked = (sheet) => !canEdit() || ST.locked.indexOf(sheet) >= 0;

  // ------------------------------------------------------------ save queue
  const QK = 'pjo-queue-' + AID;
  let queue = lsGet(QK) || [];
  let inflight = null, netErr = false, lastSaved = null, storageOk = true, flushTimer = null;

  function persistQueue() { storageOk = lsSet(QK, queue); }

  function enqueue(op) {
    // coalesce edits of the same text field / header that have not been sent yet
    const sameKey = (o) => o.type === op.type && !o._sent && (
      (op.type === 'header') ||
      (op.type === 's3' && o.item_key === op.item_key && o.field === op.field && op.field !== 'before' && op.field !== 'after') ||
      ((op.type === 'suggestion' || op.type === 's4') && o.client_id === op.client_id && !o.delete && !op.delete) ||
      (op.type === 'followup' && o.id === op.id));
    const prev = queue.find(sameKey);
    if (prev) {
      if (op.type === 'header' || op.type === 'suggestion' || op.type === 's4' || op.type === 'followup') prev.fields = Object.assign({}, prev.fields, op.fields);
      else prev.value = op.value;
    } else {
      op.op_id = uid();
      queue.push(op);
    }
    persistQueue();
    renderSave();
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 350);
  }

  async function flush() {
    if (inflight || !queue.length) { renderSave(); return; }
    const batch = [];
    let header = false;
    for (const o of queue) {
      if (batch.length >= 40) break;
      if (o.type === 'header') { if (header) break; header = true; o.lock_version = ST.lock_version; }
      o._sent = true;
      batch.push(o);
    }
    persistQueue();
    inflight = batch;
    renderSave();
    try {
      const r = await req(B.urls.ops, { ops: batch.map(o => { const c = Object.assign({}, o); delete c._sent; return c; }) });
      if (r.status === 403) { toast(r.data.message || 'ไม่มีสิทธิ์แก้ไข', true); queue = queue.filter(o => batch.indexOf(o) < 0); }
      else if (!r.ok) throw new Error(r.data.message || 'save failed');
      else {
        for (const res of r.data.results) {
          const op = batch.find(o => o.op_id === res.op_id);
          queue = queue.filter(o => o.op_id !== res.op_id);
          if (op) onResult(op, res);
        }
        ST.lock_version = r.data.lock_version;
        ST.status = r.data.status;
        lastSaved = r.data.saved_at;
        netErr = false;
      }
    } catch (e) {
      netErr = true;
      batch.forEach(o => { o._sent = false; });
    }
    inflight = null;
    persistQueue();
    renderSave();
    renderStatus();
    if (queue.length) setTimeout(flush, netErr ? 6000 : 30);
  }

  function onResult(op, res) {
    if (res.status === 'ok') {
      if (op.type === 'mark') {
        const k = op.item_key + '|' + op.occurrence;
        if (ST.marks[k]) { ST.marks[k].pending = false; ST.marks[k].at = new Date(res.recorded_at).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' }); }
        if (res.needs_issue && op._ask !== false) openFinding({ sheet: ITEMS[op.item_key].sheet, item_key: op.item_key, occurrence: op.occurrence });
      }
      if (op.type === 's3' && ST.s3[op.item_key]) { ST.s3[op.item_key]._srv = ST.s3[op.item_key]._srv || {}; ST.s3[op.item_key]._srv[op.field] = op.value; }
      return;
    }
    toast(res.message || 'บันทึกไม่สำเร็จ', true);
    if (op.type === 'mark') {
      const k = op.item_key + '|' + op.occurrence;
      if (res.current) ST.marks[k] = { v: res.current, by: res.by || '' }; else delete ST.marks[k];
      renderSheet();
    } else if (res.code === 'conflict' || res.code === 'locked') {
      refreshState();
    }
  }

  function renderSave() {
    const el = $('#saveState');
    const n = queue.length;
    let cls = '', txt;
    if (!storageOk && n) { cls = 'error'; txt = 'เบราว์เซอร์ไม่ให้เก็บข้อมูลในเครื่อง: อย่าปิดหน้านี้จนกว่าจะบันทึกขึ้น server'; }
    else if (n && (netErr || !navigator.onLine)) { cls = 'offline'; txt = 'ยังไม่ถึง server · เก็บในเครื่องนี้ ' + n + ' รายการ (รอ Sync)'; }
    else if (n) { cls = 'pending'; txt = 'กำลังบันทึก… ' + n + ' รายการ'; }
    else txt = lastSaved ? 'บันทึกขึ้น server แล้ว ' + lastSaved : 'ข้อมูลตรงกับ server';
    el.className = 'savestate ' + cls;

  function applyLocal(op) {
    if (op.type === 'mark') {
      const k = op.item_key + '|' + op.occurrence;
      if (op.value) ST.marks[k] = { v: op.value, by: B.user.name, at: 'ยังไม่ถึง server', pending: true }; else delete ST.marks[k];
    } else if (op.type === 'header') Object.assign(ST.header, op.fields);
    else if (op.type === 's3') { ST.s3[op.item_key] = ST.s3[op.item_key] || {}; ST.s3[op.item_key][op.field] = op.value; }
    else if (op.type === 'suggestion') {
      let r = ST.suggestions.find(x => x.client_id === op.client_id);
      if (op.delete) ST.suggestions = ST.suggestions.filter(x => x.client_id !== op.client_id);
      else { if (!r) { r = { client_id: op.client_id }; ST.suggestions.push(r); } Object.assign(r, op.fields); }
    } else if (op.type === 's4') {
      let r = ST.s4.find(x => x.client_id === op.client_id);
      if (op.delete) ST.s4 = ST.s4.filter(x => x.client_id !== op.client_id);
      else { if (!r) { r = { client_id: op.client_id }; ST.s4.push(r); } Object.assign(r, op.fields); }
    } else if (op.type === 'followup') {
      const f = ST.followups.find(x => x.id === op.id);
      if (f) Object.assign(f, op.fields);
    }
  }

        renderAll();

  // ------------------------------------------------------------ marks
  function setMark(key, occ, value) {
    const it = ITEMS[key];
    if (isLocked(it.sheet)) { toast('ส่วนนี้ถูกล็อก', true); return; }
    const k = key + '|' + occ;
    const cur = ST.marks[k] ? ST.marks[k].v : '';
    if (value === cur) return;
    if (value === 'na' && !it.allow_na) { toast('ข้อนี้ไม่อนุญาต N/A', true); return; }
    // prev = value the server is expected to hold, so concurrent edits are detected
    const pendingSame = queue.filter(o => o.type === 'mark' && o.item_key === key && o.occurrence === occ);
    const prev = pendingSame.length ? pendingSame[pendingSame.length - 1].value : cur;
    const op = { type: 'mark', item_key: key, occurrence: occ, value, prev };
    if (value === 'fail' && ST.findings[k]) op._ask = false;
    applyLocal(op);
    enqueue(op);
    renderSheet();
    if (value === 'fail' && !ST.findings[k] && (!navigator.onLine || netErr)) openFinding({ sheet: it.sheet, item_key: key, occurrence: occ });
  }

  // ------------------------------------------------------------ stopwatch
  const TK = (key, obs) => 'pjo-timer-' + AID + '-' + key + '-' + obs;
  function timerRunning(key, obs) {
    const t = lsGet(TK(key, obs));
    if (!t || !t.events.length) return false;
    const last = t.events[t.events.length - 1].type;
    return last === 'start' || last === 'lap' || last === 'pause' || last === 'resume';
  }
  function computeLaps(events, now) {
    const laps = []; let start = null, paused = 0, pStart = null, reasons = [];
    for (const e of events) {
      if (e.type === 'start') { start = e.t; paused = 0; pStart = null; reasons = []; }
      else if (e.type === 'pause' && start !== null && pStart === null) { pStart = e.t; reasons.push(e.reason || ''); }
      else if (e.type === 'resume' && pStart !== null) { paused += e.t - pStart; pStart = null; }
      else if ((e.type === 'lap' || e.type === 'stop') && start !== null) {
        if (pStart !== null) { paused += e.t - pStart; pStart = null; }
        laps.push({ gross: (e.t - start) / 1000, paused: paused / 1000, net: (e.t - start - paused) / 1000, reasons });
        start = e.type === 'lap' ? e.t : null; paused = 0; reasons = [];
      }
    }
    let current = null;
    if (start !== null) {
      const p = paused + (pStart !== null ? now - pStart : 0);
      current = { net: now - start - p, paused: p, isPaused: pStart !== null };
    }
    return { laps, current };
  }

    const saved = ST.timing.find(x => x.item_key === key && x.observation === obs);
    // recovery checks after reload / tab switch
    const nowWall = Date.now();
    if (T.events.length && timerRunning(key, obs)) {

      }
