        rows: d.all_signatures.map(function (s) { return [s.role_th, s.signer_name, s.signer_code, s.identity_method, s.witness, s.signed_at_th, s.revision, s.data_hash, s.superseded_at ? 'ถูกแทนที่: ' + s.superseded_reason : 'ใช้งาน']; }) });
      sheets.push({ name: 'ปัญหา', header: ISSUE_HEAD, widths: ISSUE_W, rows: d.issues.map(function (x) {
        return [x.issue_no, a.audit_no, a.workshop, d.team, x.station, hd.model, hd.employee_name, x.sheet, x.item_code, x.occurrences.map(function (o) { return o.occurrence; }).filter(Boolean).join(', '),
          x.type_th, x.priority, x.title, x.description, x.n_attachments, x.owner_name, x.due_date, x.containment, x.root_cause, x.permanent_action, x.effectiveness, x.verifier,
          x.closed_at ? PJO.fmtDT(x.closed_at) : '', x.status_th, x.overdue ? 'เกินกำหนด' : '', x.occurrences.length, x.gbr];
      }) });
      PJO.download(PJO.xlsx(sheets), a.audit_no + '_rev' + a.revision + '.xlsx');
    });
  };

  PJO.exportIssues = function (filters) {
    PJO.toast('กำลังสร้างไฟล์ Excel…');
    PJO.get('issue_register', filters || {}).then(function (d) {
      PJO.download(PJO.xlsx([{ name: 'ทะเบียนปัญหา PJO', header: ISSUE_HEAD, widths: ISSUE_W, rows: d.issues.map(function (x) {
        return [x.issue_no, x.audit_no, x.workshop, x.team_name, x.station, x.model, x.employee_name, x.sheet, x.item_code, x.occurrence_list, x.type_th, x.priority, x.title, x.description,
          x.n_attachments, x.owner_name || x.owner, x.due_date, x.containment, x.root_cause, x.permanent_action, x.effectiveness, x.verifier, x.closed_at ? PJO.fmtDT(x.closed_at) : '',
          x.status_th, x.overdue ? 'เกินกำหนด' : '', Number(x.occurrences), x.gbr];
      }) }]), 'PJO_issues_' + PJO.today().replace(/-/g, '') + '.xlsx');
    });
  };
})();
</script>
