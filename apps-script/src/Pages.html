<script>
/* Router, layout and every page except the audit form (Form) and print view (Print). */
(function () {
  'use strict';
  var h = PJO.h, app = document.getElementById('app');
  var S = PJO.session = { user: null, gbr: null, workshops: [], lookups: null };
  var STATUS_TH = { draft: 'ร่าง', in_progress: 'กำลังตรวจ', pending_signatures: 'รอลงนาม', completed: 'ตรวจและลงนามครบ', amended: 'แก้ไขหลังลงนาม (รอลงนามใหม่)', cancelled: 'ยกเลิก' };
  var ISSUE_ST = [['open', 'เปิด'], ['assigned', 'มอบหมายแล้ว'], ['in_progress', 'กำลังแก้ไข'], ['pending_verification', 'รอตรวจยืนยัน'], ['closed', 'ปิดแล้ว'], ['reopened', 'เปิดใหม่']];
  var ISSUE_TYPES = [['major', 'ความผิดปกติหลัก'], ['minor', 'ความผิดปกติรอง'], ['improvement', 'โอกาสปรับปรุง (ตาราง 2)'], ['understanding', 'ความเข้าใจ (ตาราง 3)'], ['suggestion', 'ข้อเสนอแนะพนักงาน'], ['real_event', 'ความผิดปกติที่เกิดจริง (ตาราง 4)']];
  var ROLE_TH = { admin: 'Admin', auditor: 'Auditor', tlgl: 'TL/GL', employee: 'Employee', issue_owner: 'Issue Owner', verifier: 'Verifier', viewer: 'Viewer' };

  // ---------------------------------------------------------------- helpers
  function go(hash) { if (location.hash === hash) PJO.route(); else location.hash = hash; }
  PJO.go = go;
  function q() { var out = {}; var s = (location.hash.split('?')[1] || ''); s.split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); return out; }
  function qs(o) { var p = Object.keys(o).filter(function (k) { return o[k]; }).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]); }); return p.length ? '?' + p.join('&') : ''; }
  function loading(el) { el.textContent = ''; el.append(h('div', { class: 'loading' }, h('div', { class: 'spinner' }), 'กำลังโหลด…')); }
  function pagehead(title, sub, right) { return h('div', { class: 'pagehead' }, h('div', null, h('h1', { text: title }), sub ? h('span', { class: 'muted', text: sub }) : null), right || null); }
  function sel(id, label, options, value, onchange) {
    var s = h('select', { id: id, onchange: onchange || null });
    options.forEach(function (o) { var opt = h('option', { value: o[0], text: o[1] }); if (String(o[0]) === String(value || '')) opt.selected = true; s.append(opt); });
    return h('div', null, h('label', { for: id, text: label }), s);
  }
  function inp(id, label, type, value, attrs) { return h('div', attrs && attrs.wide ? { class: 'wide' } : null, h('label', { for: id, text: label }), h(type === 'textarea' ? 'textarea' : 'input', Object.assign({ id: id, type: type === 'textarea' ? null : type, value: value || '' }, attrs && attrs.input || {}))); }
  function val(id) { var e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : ''; }
  function table(head, rows, empty) {
    var t = h('table', { class: 'tbl list' }, h('tr', null, head.map(function (x) { return h('th', { text: x }); })));
    rows.forEach(function (r) { t.append(h('tr', null, r.map(function (c) { return h('td', null, c); }))); });
    if (!rows.length) t.append(h('tr', null, h('td', { colspan: head.length, class: 'muted', text: empty || 'ไม่มีรายการ' })));
    return h('div', { class: 'tablewrap' }, t);
  }
  function wsFilter(current, onchange) {
    return h('div', { class: 'filters' }, sel('wsf', 'Workshop', [['', 'ทุก Workshop ที่มีสิทธิ์']].concat(S.workshops.map(function (w) { return [w.code, w.name]; })), current, onchange));
  }
  function auditLink(a) { return h('a', { href: '#/audit/' + a.id, text: a.audit_no }); }
  function issueLink(i) { return h('a', { href: '#/issue/' + i.id, text: i.issue_no }); }
  function gbrBadge(g) { return PJO.badge('gbr-' + g, g, S.gbr ? S.gbr[g] : ''); }
  function lookups() { return S.lookups ? Promise.resolve(S.lookups) : PJO.get('lookups').then(function (d) { S.lookups = d; return d; }); }
  function isAdmin() { return S.user && S.user.is_admin; }

  // ---------------------------------------------------------------- login / shell
  function loginPage(msg) {
    app.textContent = '';
    var f = h('form', { class: 'card', style: 'width:min(380px,100%)' },
      h('h1', { text: 'CPS PJO Audit' }), h('p', { class: 'muted', text: 'Standardized Work → PJO · Changan Rayong' }),
      msg ? h('div', { class: 'notice err', text: msg }) : null,
      inp('lu', 'ชื่อผู้ใช้', 'text', '', { input: { autocomplete: 'username', autocapitalize: 'none', required: true } }),
      inp('lp', 'PIN', 'password', '', { input: { inputmode: 'numeric', autocomplete: 'current-password', required: true } }),
      h('button', { class: 'btn primary', style: 'width:100%;margin-top:12px', type: 'submit' }, 'เข้าสู่ระบบ'));
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var b = f.querySelector('button'); b.disabled = true;
      PJO.call('login', { username: val('lu'), pin: val('lp') }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { loginPage(r.data.message); return; }
        PJO.store.set('pjo-token', r.data.token);
        start();
      }, function () { b.disabled = false; PJO.toast('เชื่อมต่อไม่ได้', true); });
    });
    app.append(h('div', { class: 'login' }, f));
  }
  PJO.onAuthLost = function (msg) { S.user = null; loginPage(msg || 'กรุณาเข้าสู่ระบบใหม่'); };
  PJO.onMustChangePin = function () { pinPage(true); };

  function pinPage(forced) {
    var body = h('div', null, forced ? h('div', { class: 'notice', text: 'ใช้ PIN ชั่วคราวอยู่ กรุณาตั้ง PIN ใหม่ (ตัวเลข 6–8 หลัก)' }) : null,
      forced ? null : inp('op', 'PIN เดิม', 'password', '', { input: { inputmode: 'numeric' } }),
      inp('np', 'PIN ใหม่', 'password', '', { input: { inputmode: 'numeric' } }), inp('np2', 'ยืนยัน PIN ใหม่', 'password', '', { input: { inputmode: 'numeric' } }));
    var ok = h('button', { type: 'button', class: 'btn primary' }, 'บันทึก PIN');
    var m = PJO.modal('ตั้ง PIN ใหม่', body, forced ? [ok] : [h('button', { type: 'button', class: 'btn', onclick: function () { m.close(); } }, 'ยกเลิก'), ok]);
    ok.addEventListener('click', function () {
      if (val('np') !== val('np2')) { PJO.toast('PIN ใหม่ไม่ตรงกัน', true); return; }
      PJO.get('change_pin', { old_pin: val('op'), new_pin: val('np') }).then(function () { m.close(); PJO.toast('ตั้ง PIN แล้ว'); start(); });
    });
  }

  var NAV = [['#/', 'Dashboard'], ['#/calendar', 'ปฏิทินแผนตรวจ'], ['#/plans', 'แผนและรายการตรวจ PJO'], ['#/start', 'เริ่มตรวจ PJO'], ['#/issues', 'ติดตามปัญหา'],
    ['#/signatures', 'รายการรอลงนาม'], ['#/standards', 'จัดการแม่แบบและมาตรฐาน'], ['#/reports', 'รายงานและ Export']];
  function shell() {
    app.textContent = '';
    var side = h('aside', { class: 'side', onclick: function (e) { if (e.target.tagName === 'A') side.classList.remove('open'); } },
      h('div', { class: 'brandmark' }, 'CPS PJO Audit', h('small', { text: 'Standardized Work → PJO' })),
      h('nav', { id: 'nav' }, NAV.concat(isAdmin() ? [['#/admin', 'ผู้ใช้และข้อมูลหลัก']] : []).map(function (n) { return h('a', { href: n[0], dataset: { r: n[0] }, text: n[1] }); })),
      h('div', { class: 'who' }, h('b', { text: S.user.name }), (S.user.roles || []).map(function (r) { return ROLE_TH[r.role] + (r.workshop === 'ALL' ? '' : ' ' + r.workshop); }).join(', ') || 'ยังไม่มีบทบาท',
        h('div', { class: 'btnrow', style: 'margin-top:8px' },
          h('button', { class: 'btn small', type: 'button', onclick: function () { pinPage(false); } }, 'เปลี่ยน PIN'),
          h('button', { class: 'btn small', type: 'button', onclick: function () { PJO.call('logout', {}); PJO.store.del('pjo-token'); loginPage(); } }, 'ออกจากระบบ'))));
    app.append(h('div', { class: 'topbar' }, h('button', { type: 'button', 'aria-label': 'เมนู', onclick: function () { side.classList.toggle('open'); } }, '☰'), h('b', { text: 'CPS PJO Audit' })),
      h('div', { class: 'shell' }, side, h('main', { class: 'main', id: 'main' })));
  }
  function setNav(r) {
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.r === r); });
  }

  function start() {
    if (!PJO.store.get('pjo-token')) { loginPage(); return; }
    PJO.call('me', {}).then(function (r) {
      if (!r.ok) { if (r.data.code !== 'auth') loginPage(r.data.message); return; }
      S.user = r.data.user; S.gbr = r.data.gbr; S.workshops = r.data.workshops; S.lookups = null;
      if (S.user.must_change_pin) { app.textContent = ''; pinPage(true); return; }
      shell();
      PJO.route();
    }, function () { app.textContent = ''; app.append(h('div', { class: 'loading', text: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วโหลดหน้าใหม่' })); });
  }

  PJO.route = function () {
    if (!S.user) return;
    if (!document.getElementById('main')) shell();
    var main = document.getElementById('main');
    var path = location.hash.split('?')[0] || '#/';
    var m;
    window.scrollTo(0, 0);
    if (path === '#/' || path === '#' || path === '') { setNav('#/'); return dashboard(main); }
    if (path === '#/plans') { setNav('#/plans'); return plans(main); }
    if (path === '#/calendar') { setNav('#/calendar'); return calendar(main); }
    if (path === '#/start') { setNav('#/start'); return startAudit(main); }
    if ((m = /^#\/audit\/(\d+)$/.exec(path))) { setNav('#/start'); return openAudit(main, m[1]); }
    if (path === '#/issues') { setNav('#/issues'); return issues(main); }
    if ((m = /^#\/issue\/(\d+)$/.exec(path))) { setNav('#/issues'); return issueDetail(main, m[1]); }
    if (path === '#/signatures') { setNav('#/signatures'); return signatures(main); }
    if (path === '#/standards') { setNav('#/standards'); return standards(main); }
    if ((m = /^#\/standard\/(\d+)$/.exec(path))) { setNav('#/standards'); return standardDetail(main, m[1]); }
    if (path === '#/reports') { setNav('#/reports'); return reports(main); }
    if ((m = /^#\/print\/(\d+)$/.exec(path))) { setNav('#/reports'); return PJO.printAudit(main, m[1]); }
    if (path === '#/admin') { setNav('#/admin'); return admin(main); }
    main.textContent = 'ไม่พบหน้า';
  };
  window.addEventListener('hashchange', PJO.route);

  // ---------------------------------------------------------------- dashboard
  function tile(n, label, href, cls) { return h(href ? 'a' : 'div', { class: 'tile ' + (cls || ''), href: href || null }, h('div', { class: 'n', text: n }), h('div', { class: 'l' }, label)); }
  function dashboard(main) {
    var p = q();
    loading(main);
    PJO.get('dashboard', { workshop: p.workshop }).then(function (d) {
      main.textContent = '';
      main.append(pagehead('Dashboard', 'ข้อมูลจริงจากการตรวจในระบบ ไม่มีคะแนนรวม PJO', h('a', { class: 'btn primary', href: '#/start' }, '+ เริ่มตรวจ PJO')),
        wsFilter(p.workshop, function (e) { go('#/' + qs({ workshop: e.target.value })); }),
        h('h2', { text: 'แผนตรวจเดือนนี้' }),
        h('div', { class: 'tiles' },
          d.plan_total ? tile(d.plan_done + ' / ' + d.plan_total, 'ตรวจและลงนามครบ / แผน', '#/plans') : tile('–', 'ยังไม่มีแผนตรวจเดือนนี้ จึงไม่คำนวณความสำเร็จตามแผน'),
          tile(d.in_progress, 'กำลังตรวจ / ร่าง', '#/plans?status=in_progress'), tile(d.pending_sig, 'รอลงนาม', '#/signatures', d.pending_sig ? 'warn' : ''),
          tile(d.completed, 'ตรวจและลงนามครบ', '#/plans?status=completed'), tile(d.completed_open, 'ตรวจครบ แต่ยังมีปัญหาเปิด', null, d.completed_open ? 'warn' : '')),
        h('h2', { text: 'ความผิดปกติ (ตาราง 1)' }),
        h('div', { class: 'tiles' }, tile(d.major, [PJO.badge('b-major', 'หลัก'), ' จำนวนช่อง ×'], null, 'alert'), tile(d.minor, [PJO.badge('b-minor', 'รอง'), ' จำนวนช่อง ×'], null, 'warn'),
          tile(d.fu_training, 'ความผิดปกติหลัก รอฝึกอบรม', '#/signatures', d.fu_training ? 'alert' : ''), tile(d.fu_recert, 'ฝึกอบรมแล้ว รอรับรองใหม่', '#/signatures', d.fu_recert ? 'warn' : '')),
        h('h2', { text: 'ปัญหา' }),
        h('div', { class: 'tiles' }, tile(d.issues_open, 'ยังไม่ปิด', '#/issues'), tile(d.issues_overdue, [gbrBadge('R'), ' เกินกำหนด'], '#/issues?gbr=R', d.issues_overdue ? 'alert' : ''),
          tile(d.issues_verify, 'รอตรวจยืนยัน', '#/issues?status=pending_verification'), tile(d.issues_repeat, 'ปัญหาซ้ำ (พบมากกว่า 1 ครั้ง)', '#/issues?repeat=1')),
        h('div', { class: 'grid', style: 'grid-template-columns:repeat(auto-fit,minmax(300px,1fr))' },
          h('div', { class: 'card' }, h('h3', { text: 'ข้อที่พบ × บ่อย' }), table(['Workshop', 'ข้อ', 'ครั้ง'], d.top_items.map(function (x) { return [x.workshop, x.text + '…', String(x.n)]; }), 'ยังไม่มีข้อมูล')),
          h('div', { class: 'card' }, h('h3', { text: 'ปัญหาเกินกำหนด' }), table(['Issue', 'รายละเอียด', 'Due'], d.overdue_list.map(function (i) { return [issueLink(i), i.title, PJO.fmtDate(i.due_date)]; }), 'ไม่มี'))),
        h('div', { class: 'card' }, h('h3', { text: 'Audit ล่าสุด' }), table(['เลข Audit', 'วันที่', 'Workshop', 'Station', 'พนักงาน', 'สถานะ'],
          d.recent.map(function (a) { return [auditLink(a), PJO.fmtDate(a.audit_date), a.workshop, a.station, a.employee_name, PJO.badge('b-' + a.status, a.status_th)]; }), 'ยังไม่มีการตรวจ')));
    });
  }

  // ---------------------------------------------------------------- plans: shared pieces
  function monthAdd(m, n) { var p = m.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1 + n, 1)); return d.toISOString().slice(0, 7); }
  var MONTH_TH = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  function monthTh(m) { var p = m.split('-'); return MONTH_TH[Number(p[1]) - 1] + ' ' + p[0]; }
  function stateChip(st) { return h('span', { class: 'pchip-st c-' + st.color, text: st.label }); }
  function timingText(t, win) {
    if (!t) return '';
    return 'เริ่ม ' + t.start_hm + (t.end_hm ? ' · ส่ง ' + t.end_hm + ' · ' + t.minutes + ' นาที' : ' · ยังไม่ส่งลงนาม');
  }
  function startFromPlan(pl) {
    if (pl.planned_date !== PJO.today() && !(pl.state.audits || []).length && !confirm('แผนนี้เป็นของวันที่ ' + PJO.fmtDate(pl.planned_date) + ' เริ่มตรวจวันนี้เลยหรือไม่?')) return;
    PJO.get('plan_start', { plan_id: pl.id }).then(function (d) { go('#/audit/' + d.id); });
  }
  function importPlans(p) {
    lookups().then(function (lk) {
      PJO.planImport({ lookups: lk, workshop: p.workshop, onDone: function (r) { S.lookups = null; go('#/calendar' + qs({ month: r.month, workshop: p.workshop })); } });
    });
  }
  function planDialog(id, after) {
    PJO.get('plan_get', { plan_id: id }).then(function (pl) {
      lookups().then(function (lk) {
        var body = h('div'), foot = h('div', { class: 'btnrow' }), dlg = PJO.modal('แผนตรวจ ' + PJO.fmtDate(pl.planned_date), body, foot);
        function view() {
          body.textContent = ''; foot.textContent = '';
          var st = pl.state;
          body.append(h('div', null, h('div', { class: 'pplan-head c-' + st.color }, stateChip(st), st.why.map(function (w) { return h('div', { class: 'muted', text: w }); })),
            h('dl', { class: 'pkv' }, [['Workshop', pl.workshop], ['ทีม', pl.team_name || '–'], ['หมายเลขตำแหน่งงาน', pl.station], ['พนักงาน', (pl.employee_name || '–') + (pl.employee_code ? ' (' + pl.employee_code + ')' : '')],
              ['ระดับตำแหน่งงาน', pl.level || '–'], ['หมายเหตุ', pl.note || '–']].map(function (kv) { return [h('dt', { text: kv[0] }), h('dd', { text: kv[1] })]; })),
            st.audits.length ? h('div', null, h('h3', { text: 'การตรวจ' }), st.audits.map(function (a) {
              return h('div', { class: 'pplan-audit' }, auditLink(a), ' ', PJO.badge('b-' + a.status, a.status_th), h('div', { class: 'muted', text: timingText(a.timing) }));
            })) : null,
            pl.history.length ? h('details', null, h('summary', { text: 'ประวัติการเปลี่ยนแผน (' + pl.history.length + ')' }), pl.history.map(function (x) {
              var ch = Object.keys(x.to).map(function (k) { return (PLAN_FIELD_TH[k] || k) + ': ' + (x.from[k] || '–') + ' → ' + x.to[k]; }).join(' · ');
              return h('div', { class: 'pplan-hist' }, h('b', { text: PJO.fmtDT(x.at) + ' · ' + (x.by_name || x.by) }), h('div', { text: 'เหตุผล: ' + x.reason }), h('div', { class: 'muted', text: ch }));
            })) : null));
          var submitted = st.audits.some(function (a) { return a.timing && a.timing.finished_at; });
          foot.append(h('button', { type: 'button', class: 'btn', onclick: dlg.close }, 'ปิด'));
          if (pl.can_edit && !submitted) {
            foot.append(h('button', { type: 'button', class: 'btn danger', onclick: cancelForm }, 'ยกเลิกแผน'), h('button', { type: 'button', class: 'btn', onclick: editForm }, 'เปลี่ยนแผน'));
            foot.append(h('button', { type: 'button', class: 'btn primary', onclick: function () { dlg.close(); startFromPlan(pl); } }, st.audits.length ? 'เปิด Audit ที่ตรวจอยู่' : 'เริ่มตรวจ'));
          }
        }
        function editForm() {
          body.textContent = ''; foot.textContent = '';
          var teams = lk.teams.filter(function (t) { return t.workshop === pl.workshop; }), emps = lk.employees.filter(function (e) { return e.workshop === pl.workshop; });
          body.append(h('p', { class: 'muted', text: 'เช่น พนักงานประจำสถานีลา ให้เปลี่ยนพนักงานหรือตำแหน่งงาน ระบบจะเก็บประวัติการเปลี่ยนไว้' }),
            h('div', { class: 'grid' }, inp('pe_date', 'วันที่แผน', 'date', pl.planned_date),
              inp('pe_team', 'ทีม', 'text', pl.team_name, { input: { list: 'pe_teams' } }), h('datalist', { id: 'pe_teams' }, teams.map(function (t) { return h('option', { value: t.name }); })),
              inp('pe_station', 'หมายเลขตำแหน่งงาน', 'text', pl.station),
              inp('pe_name', 'ชื่อพนักงาน', 'text', pl.employee_name, { input: { list: 'pe_emps' } }), h('datalist', { id: 'pe_emps' }, emps.map(function (e) { return h('option', { value: e.name }, e.code); })),
              sel('pe_level', 'ระดับตำแหน่งงาน', [['', '-'], ['A', 'A'], ['B', 'B'], ['C', 'C']], pl.level),
              inp('pe_note', 'หมายเหตุ', 'text', pl.note),
              inp('pe_reason', 'เหตุผลการเปลี่ยนแผน *', 'text', '', { wide: true, input: { placeholder: 'เช่น พนักงานลาป่วย / ไลน์หยุด' } })));
          var save = h('button', { type: 'button', class: 'btn primary' }, 'บันทึกการเปลี่ยนแผน');
          foot.append(h('button', { type: 'button', class: 'btn', onclick: view }, 'ย้อนกลับ'), save);
          save.addEventListener('click', function () {
            save.disabled = true;
            PJO.get('plan_update', { plan_id: pl.id, planned_date: val('pe_date'), team_name: val('pe_team'), station: val('pe_station'), employee_name: val('pe_name'),
              level: val('pe_level'), note: val('pe_note'), reason: val('pe_reason') }).then(function () {
              PJO.toast('เปลี่ยนแผนแล้ว'); dlg.close(); if (after) after();
            }, function () { save.disabled = false; });
          });
        }
        function cancelForm() {
          body.textContent = ''; foot.textContent = '';

  /** Start → first "ส่งลงนาม" is the audit time, checked against the daily window (default 14:30–15:30, 60 min). */
  function timeBar(d) {
    var t = d.timing, w = d.window;
    if (!t) return null;
    var bar = h('div', { class: 'timebar' });
    var skew = new Date(d.server_now).getTime() - Date.now();
    function hm(ms) { return new Date(ms + 7 * 3600e3).toISOString().slice(11, 16); }
    function paint() {
      bar.textContent = '';
      var end = t.finished_at ? new Date(t.finished_at).getTime() : Date.now() + skew;
      var mins = Math.floor((end - new Date(t.started_at).getTime()) / 60000);
      var endHm = hm(end), endMin = Number(endHm.slice(0, 2)) * 60 + Number(endHm.slice(3)), lim = Number(w.end.slice(0, 2)) * 60 + Number(w.end.slice(3)) + w.grace;
      var over = endMin > lim, short = t.finished_at && mins < w.min_minutes;
      var startMin = Number(t.start_hm.slice(0, 2)) * 60 + Number(t.start_hm.slice(3)), early = startMin < Number(w.start.slice(0, 2)) * 60 + Number(w.start.slice(3)) - w.grace;
      bar.append(h('span', { class: 'timebar-in' }, h('span', null, '⏱ เวลาตรวจ: เริ่ม ', h('b', { text: t.start_hm }), t.finished_at ? [' · ส่งลงนาม ', h('b', { text: t.end_hm })] : null),
        h('span', null, 'ใช้เวลา ', h('b', { text: mins + ' นาที' }), ' / มาตรฐาน ' + w.min_minutes + ' นาที'),
        h('span', { class: 'muted', text: 'ช่วงเวลาตรวจ ' + w.start + '–' + w.end }),
        t.finished_at ? PJO.badge(t.in_window && !short ? 'b-completed' : t.in_window ? 'b-amended' : 'b-overdue', !t.in_window ? 'ตรวจนอกเวลา' : short ? 'เวลาไม่ครบ' : 'ตรงเวลา · ครบเวลา')
          : over ? PJO.badge('b-overdue', 'เลยเวลา ' + w.end) : early ? PJO.badge('b-overdue', 'เริ่มก่อนช่วงเวลา ' + w.start) : null,
        d.plan && d.plan.planned_date !== t.day ? PJO.badge('b-overdue', 'แผนวันที่ ' + PJO.fmtDate(d.plan.planned_date)) : null));
    }
    paint();
    if (!t.finished_at) { var iv = setInterval(function () { if (!document.body.contains(bar)) { clearInterval(iv); return; } paint(); }, 30000); }
    return bar;
  }
