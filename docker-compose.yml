services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cps_pjo}
      POSTGRES_USER: ${POSTGRES_USER:-cps_pjo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cps_pjo}"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - private_media:/data/private_media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  private_media:
